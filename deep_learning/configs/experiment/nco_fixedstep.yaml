# @package _global_

# to execute this experiment run:
# python train.py experiment=nco_fixedstep

defaults:
  - override /datamodule: default
  - override /module: fixedstep
  - override /module/problem: nco
  - override /module/loss: mse
  - override /module/optimizer: adamw
  - override /module/scheduler: reduceonplateau
  - override /module/network@module.network.h2h: modmlp
  - override /trainer: gpu
  - override /callbacks: 
    - hparams_updater
    - val_checkpoint
    - latest_checkpoint
    - lr_monitor
    - fixed_seq_weights
    # - seq_len_scheduler
    - metrics_logger
    - tqdm_progress_bar
    - predict_and_plot_trajectory
    - early_stopping

datamodule:
  train:
    data_dir: /workspace/projects_rui/learnsolnmap/data1/nco/epsilon=1e-2/version22/Dt=5e0/train
    Dt: 5.0
    sequence_len: 2
    downsample_factor: 0.02
  test:
    data_dir: /workspace/projects_rui/learnsolnmap/data1/nco/epsilon=1e-2/version22/Dt=5e0/test
    Dt: 5.0
    sequence_len: 2
    downsample_factor: 1.0
  batch_size: 100

  # supervised:
  #   train:
  #     data_dir: /workspace/projects_rui/learnsolnmap/data1/nco/epsilon=1e-2/version22/Dt=5e0
  #     downsample_factor: 1.0
  #   test:
  #     data_dir: /workspace/projects_rui/learnsolnmap/data1/nco/epsilon=1e-2/version23/Dt=5e0/test
  #     downsample_factor: 0.1
  #   batch_size: 1000
  # unsupervised:
  #   train:
  #     data_dir: /workspace/projects_rui/learnsolnmap/data1/nco/epsilon=1e-2/version20/Dt=5e0/train
  #     downsample_factor: 0.01
  #   test:
  #     data_dir: /workspace/projects_rui/learnsolnmap/data1/nco/epsilon=1e-2/version20/Dt=5e0/test
  #     downsample_factor: 0.1
  #   batch_size: 10

trainer:
  max_epochs: -1
  max_steps: 1000000
  min_steps: 500000
  # gradient_clip_val: 2.0
  # gradient_clip_algorithm: value
  # log_every_n_steps: 4

module:
  T0: 5e0
  
  # loss:
  #   weight: [0.01, 1., 0.01, 1.]

  loss_hparams:
    data_misfit:
      strength: 1.0

  optimizer:
    lr: 1e-3
    # weight_decay: 0.0
  
  scheduler:
    scheduler:
      # steps_per_epoch: 96
      # steps_per_epoch: 960
      # steps_per_epoch: 10
      # pct_start: 0.1
      factor: 0.9
      # patience: 8
      patience: 5000
    
    extras:
      monitor: step_loss
      interval: step

  network:
    h2h:
      input_dim: 4 
      output_dim: 4
      # dof: 2
      hidden_dim: 1000
      n_hidden_layers: 6
      # n_henon_layers: 16
      # NIHenon_hidden_dim: 8
      # NIHenon_n_hidden_layers: 1
      # NIHenon_n_henon_layers: 20
      # Henon_hidden_dim: 8
      # Henon_n_hidden_layers: 1
      # Henon_n_henon_layers: 20
      # activation:
      #   _target_: torch.nn.Tanh

callbacks:
  fixed_seq_weights:
    _target_: callbacks.sequence_weights.FixedSequenceWeights
    # weights: [0., 1., 1., 1., 1., 1.]
    weights: [0., 1.,]
  # seq_len_scheduler:
    # weights: [1., 1., 1., 1., 1., 1.]
    # milestones: [10, 20, 50, 100, 200]
    # init_len: 1
  predict_and_plot_trajectory:
    nsteps: 1000
    save_predictions: false
    log_freq: 20

  early_stopping:
    monitor: val/loss
    patience: 20

  hparams_updater:
    # metric_hparams: 
    #   commutative:
    #     strength: 1.0
    #     integrator:
    #       method: VelocityVerlet
    #       stepsize: 0.1
    #       nsteps: 1
    #     K: 5

loggers:
  wandb:
    group: nco_fixedstep
