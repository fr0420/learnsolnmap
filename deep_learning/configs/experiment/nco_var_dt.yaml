# @package _global_

# to execute this experiment run:
# python train.py experiment=nco_var_dt

defaults:
  - override /datamodule: default
  - override /module: vardtsolnmap
  - override /module/problem: nco
  - override /module/loss: mse
  - override /module/optimizer: adamw
  - override /module/scheduler: reduceonplateau
  - override /module/network: modmlp
  - override /trainer: gpu
  - override /callbacks: 
    - hparams_updater
    - val_checkpoint
    - latest_checkpoint
    - lr_monitor
    - metrics_logger
    - tqdm_progress_bar
    - predict_and_plot_trajectory
    - early_stopping

datamodule:
  train:
    data_dir: /workspace/projects_rui/learnsolnmap/data1/nco/epsilon=1e-2/version22/max_Dt=1e1_min_Dt=-1e1/train
    # data_dir: /workspace/projects_rui/learnsolnmap/data1/nco/epsilon=1e-2/version23/max_Dt=1e1_min_Dt=-1e1
    sequence_len: 2
    downsample_factor: 0.2
    Dt_range: [-10.0, 10.0]
    exclude: false
  test:
    data_dir: /workspace/projects_rui/learnsolnmap/data1/nco/epsilon=1e-2/version22/max_Dt=1e1_min_Dt=-1e1/test
    sequence_len: 2
    downsample_factor: 1.0
    Dt_range: [-10.0, 10.0]
    exclude: false
  batch_size: 100

trainer:
  max_epochs: -1
  max_steps: 1000000
  min_steps: 500000
  gradient_clip_val: 2.0
  gradient_clip_algorithm: value
  # log_every_n_steps: 4

module:
  use_dimensionless: true
  use_dimensionless_for_loss: true
  
  loss_hparams:
    # misfit: 
    #   strength: 1.0
    additive_vv:
      strength: 1.0
      batch_size: 2000
      integrator: 
        method: VelocityVerlet
        stepsize: 0.1
        nsteps: 1
      h_min: -10.
      h_max: 10.
  
  optimizer:
    lr: 1e-3
    # weight_decay: 0.0
  
  scheduler:
    scheduler:
      # steps_per_epoch: 96
      # steps_per_epoch: 960
      # steps_per_epoch: 10
      # pct_start: 0.1
      factor: 0.9
      # patience: 8
      patience: 5000
    
    extras:
      monitor: step_loss
      interval: step

  network:
    # layer_sizes: [5, 500, 500, 500, 500, 4]
    input_dim: 5
    output_dim: 4
    hidden_dim: 1000
    n_hidden_layers: 6
    # activation:
    #   _target_: torch.nn.Tanh


callbacks:
  predict_and_plot_trajectory:
    nsteps: 1000
    Dt: 5.0
    save_predictions: false
    log_freq: 10

  early_stopping:
    monitor: val/loss
    patience: 20
  
  hparams_updater:
    metric_hparams:
      # dynamics:    
      # commutative: 
      #   s_min: -4.
      #   s_max: 4. 
      #   t_min: -4.
      #   t_max: 4.
      # commutative_vv: 
      #   s_min: -4.
      #   s_max: 4. 
      #   t_min: 0.1
      #   t_max: 0.1
      # additive: 
      #   s_min: -2.
      #   s_max: 2. 
      #   t_min: -2.
      #   t_max: 2.
      # additive_vv:
      #   s_min: -4.
      #   s_max: 4.
      #   t_min: 0.1
      #   t_max: 0.1
      # dyadic:
      #   h_min: -2.
      #   h_max: 2.
      # reversibility:
      #   h_min: -4.
      #   h_max: 4.

loggers:
  wandb:
    group: nco_var_dt
