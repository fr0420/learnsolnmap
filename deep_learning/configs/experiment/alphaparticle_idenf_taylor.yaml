# @package _global_

# to execute this experiment run:
# python train.py experiment=alphaparticle_idenf_taylor

defaults:
  - override /datamodule: default
  - override /module: identityenforced_taylor
  - override /module/problem: alphaparticle
  - override /module/loss: energynormsquared
  - override /module/optimizer: adamw
  - override /module/scheduler: 1cycle
  - override /module/network: piratenet
  - override /trainer: gpu
  - override /callbacks: 
    - hparams_updater
    # - integrator_stepsize_scheduler
    - val_checkpoint
    - latest_checkpoint
    - lr_monitor
    - metrics_logger
    - tqdm_progress_bar
    - predict_and_plot_trajectory
    # - early_stopping
    - monitor_parameters
    # - time_distribution_scheduler

seed: 42

datamodule:
  train:
    # data_dir: /workspace/projects_rui/learnsolnmap/data1/alphaparticle/eps=5e-2/version1/Dt=1e1/train
    data_dir: /workspace/projects_rui/learnsolnmap/data1/alphaparticle/eps_mixed/version3/Dt=1e1/train
    Dt: 10.0
    # Dt_range: [-1, 1]
    sequence_len: 2
    downsample_factor: 1.0
    required_params: ['epsilon']
  test:
    # data_dir: /workspace/projects_rui/learnsolnmap/data1/alphaparticle/eps=5e-2/version1/Dt=1e1/test
    data_dir: /workspace/projects_rui/learnsolnmap/data1/alphaparticle/eps_mixed/version3/Dt=1e1/test
    Dt: 10.0
    # Dt_range: [-1, 1]
    sequence_len: 2
    downsample_factor: 1.0
    required_params: ['epsilon']
  batch_size: 200
  num_workers: 0

trainer:
  max_epochs: -1
  max_steps: 10000000
  min_steps: 500000
  # gradient_clip_val: 2.0
  # gradient_clip_algorithm: value
  # log_every_n_steps: 4
  # precision: 64-true

module:
  problem:
    epsilon: 0.15

  order: 2

  use_dimensionless: false

  preserve_velocity_norm: true 

  problem_param_keys: ['epsilon']

  loss_hparams:
    # data_misfit: 
    #   strength: 1.0
    numerical_residual:
      strength: 1.0
      batch_size: 800
      integrator: 
        method: ImplicitMidpoint
        stepsize: 0.01
        nsteps: 1
      u0_dist:
        type: random
      t_dist:
        type: uniform
        min: 0.
        max: 10.
        # type: normal
        # mean: 0.
        # std: 5.
      use_mse: false
    # residual: 
    #   strength: 1.0
    #   batch_size: 800
    #   u0_dist:
    #     type: random
    #   t_dist:
    #     type: uniform
    #     min: 0.
    #     max: 5.
    #     # type: normal
    #     # mean: 0.
    #     # std: 5.
    #   use_mse: true
  
  # loss:
  #   weight: [0.01, 1., 0.01, 1.]
  
  optimizer:
    lr: 0.0005
    weight_decay: 0.01
  
  scheduler:
    scheduler:
      total_steps: 1000000
      pct_start: 0.1
      # factor: 0.9
      # patience: 8
      # patience: 5000
    
    extras:
      monitor: step_loss
      interval: step

  multiplier_activation:
    _target_: torch.nn.Tanh

  network:
    # layer_sizes: [5, 500, 500, 500, 500, 4]
    input_dim: 10
    output_dim: 4
    hidden_dim: 1000
    # n_hidden_layers: 6
    n_blocks: 2
    n_linears_per_block: 3
    use_branched_output_layers: true
    # activation:
    #   _target_: torch.nn.Tanh


callbacks:
  predict_and_plot_trajectory:
    nsteps: 1000
    Dt: 5.0
    save_predictions: false
    log_freq: 10
  
  monitor_parameters:
    param_names: ['w1', 'w2', 'w3']
    every_n_epochs: 5
  
  # val_checkpoint:
  #   save_top_k: 3
  #   save_weights_only: true
  #   # every_n_epochs: 5

  # last_checkpoint:
  #   save_weights_only: true

  # early_stopping:
  #   monitor: val/loss
  #   patience: 20
  
  # time_distribution_scheduler:
  #   schedule_keys: [20000, 40000, 60000, 80000, 100000]
  #   schedule_values: 
  #     - type: uniform
  #       min: -10.
  #       max: 10.
  #     - type: uniform
  #       min: -20.
  #       max: 20.
  #     - type: uniform
  #       min: -30.
  #       max: 30.
  #     - type: uniform
  #       min: -40.
  #       max: 40.
  #     - type: uniform
  #       min: -50.
  #       max: 50.
  #   by_epoch: false

  # integrator_stepsize_scheduler:
  #   base_stepsize: 0.1
  #   schedule_keys: [50000, 100000, 150000, 200000, 250000]
  #   schedule_values: [0.8, 0.6, 0.4, 0.2, 0.1]
  #   by_epoch: false
  #   base_batch_size: 2000
  #   adjust_batch_size: true

  hparams_updater:
    metric_hparams:

loggers:
  wandb:
    group: alphaparticle
