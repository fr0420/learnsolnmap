# @package _global_

# to execute this experiment run:
# python train.py experiment=threebody2d_equalmass_t0centered

defaults:
  - override /datamodule: default
  - override /module: t0centered
  - override /module/problem: threebody2d
  - override /module/loss: mse
  - override /module/optimizer: adamw
  - override /module/scheduler: 1cycle
  - override /module/network@module.net_T0: modmlp
  - override /module/network@module.net_residual: modmlp 
  - override /trainer: gpu
  - override /callbacks: 
    - hparams_updater
    - val_checkpoint
    - latest_checkpoint
    - lr_monitor
    - fixed_seq_weights
    # - seq_len_scheduler
    - metrics_logger
    - tqdm_progress_bar
    - predict_and_plot_trajectory
    # - early_stopping
    - monitor_parameters


datamodule:
  train:
    data_dir: /workspace/projects_rui/learnsolnmap/data1/3body-2d-equalmass/version6/Dt=5e-1_filtered/train
    Dt: 0.5
    # Dt_range: [-1, 1]
    sequence_len: 2
    downsample_factor: 1.0
  test:
    data_dir: /workspace/projects_rui/learnsolnmap/data1/3body-2d-equalmass/version6/Dt=5e-1_filtered/test
    Dt: 0.5
    # Dt_range: [-1, 1]
    sequence_len: 2
    downsample_factor: 1.0
  batch_size: 100
  num_workers: 0

  # supervised:
  #   train:
  #     data_dir: /workspace/projects_rui/learnsolnmap/data1/3body-2d-equalmass/version6/Dt=5e-1_filtered/train
  #     Dt: 0.5
  #     # Dt_range: [-1, 1]
  #     sequence_len: 2
  #     downsample_factor: 1.0
  #   test:
  #     data_dir: /workspace/projects_rui/learnsolnmap/data1/3body-2d-equalmass/version6/Dt=5e-1_filtered/test
  #     Dt: 0.5
  #     # Dt_range: [-1, 1]
  #     sequence_len: 2
  #     downsample_factor: 1.0
  #   batch_size: 100

  # unsupervised:
  #   train:
  #     data_dir: /workspace/projects_rui/learnsolnmap/data1/3body-2d-equalmass/version6/inputs/train
  #     Dt: 0.0
  #     sequence_len: 1
  #     downsample_factor: 1.0
  #   test:
  #     data_dir: /workspace/projects_rui/learnsolnmap/data1/3body-2d-equalmass/version6/inputs/test
