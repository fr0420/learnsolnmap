# @package _global_

# to execute this experiment run:
# python train.py experiment=fpu_t0centered

defaults:
  - override /datamodule: default
  - override /module: t0centered
  - override /module/problem: fpu
  - override /module/loss: anchoredenergynormsquared
  - override /module/optimizer: adamw
  - override /module/scheduler: 1cycle
  - override /module/network@module.net_T0: modmlp
  - override /module/network@module.net_residual: modmlp 
  - override /trainer: gpu
  - override /callbacks: 
    - hparams_updater
    - val_checkpoint
    - latest_checkpoint
    - lr_monitor
    - fixed_seq_weights
    # - seq_len_scheduler
    - metrics_logger
    - tqdm_progress_bar
    - predict_and_plot_trajectory
    # - early_stopping
    - monitor_parameters


