trainer:
  max_epochs: -1
  max_steps: 1000000
  min_steps: 500000
  # min_epochs: 200
  # gradient_clip_val: 2.0
  # gradient_clip_algorithm: value
  # log_every_n_steps: 4

module:
  T0: 0.125

  use_dimensionless: false

  problem:
    omega: 300
  
  # loss:
  #   problem:
  #     omega: 1.0
  
  loss_hparams:
    data_misfit:
      strength: 1.0
    numerical_residual:
      strength: 1e-4
      # batch_size: 2000
      integrator: 
        method: VelocityVerlet
        stepsize: 1e-4
        nsteps: 1
      u0_dist:
        type: precomputed
      t_dist:
        # type: uniform
        # min: -20.
        # max: 20.
        type: normal
        mean: 0.125
        std: 0.005
      use_mse: false
    # residual:
    #   strength: 1.0
    #   batch_size: 2000
    #   t_dist:
    #     type: uniform
    #     min: 0.125
    #     max: 0.125
    #     # type: normal
    #     # mean: 0.125
    #     # std: 0.005
    #   use_mse: true

  optimizer:
    lr: 1e-4
  
  scheduler:
    scheduler:
      total_steps: 1000000
      # steps_per_epoch: 1600
      pct_start: 0.1
      # factor: 0.9
      # patience: 8
      # patience: 5000
    
    extras:
      monitor: step_loss
      interval: step

  multiplier_activation:
    _target_: torch.nn.Tanh

  # temporal_encoding:
  #   _target_: modules.variable_timestep.Time2VecEncoding
  #   output_dim: 5
  #   min_period: 1.0
  #   max_period: 1000.0

  net_residual:
    input_dim: 13 
    output_dim: 12
    hidden_dim: 1000
    n_hidden_layers: 12
    # n_henon_layers: 16
    # activation:
    #   _target_: torch.nn.Tanh

  net_T0:
    input_dim: 12 
    output_dim: 12 
    hidden_dim: 1000
    n_hidden_layers: 6
    activation:
      _target_: torch.nn.ELU

callbacks:
  fixed_seq_weights:
    _target_: callbacks.sequence_weights.FixedSequenceWeights
    # weights: [0., 1., 1., 1., 0., 0.]
    weights: [0., 1.]
  # seq_len_scheduler:
    # weights: [1., 1., 1., 1., 1., 1.]
    # milestones: [10, 20, 50, 100, 200]
    # init_len: 1s

  predict_and_plot_trajectory:
    nsteps: 1000
    Dt: 0.125
    save_predictions: false
    log_freq: 10

  monitor_parameters:
    # param_names: ['scale', 'mult_w', 'temp_enc.log_frequencies']
    param_names: ['scale', 'mult_w']
    every_n_epochs: 5
  
  early_stopping:
    monitor: val/loss
    patience: 20

  # val_checkpoint:
  #   save_weights_only: true
  #   save_top_k: -1
  #   every_n_epochs: 25

  latest_checkpoint:
    save_weights_only: true

loggers:
  wandb:
    group: fpu
