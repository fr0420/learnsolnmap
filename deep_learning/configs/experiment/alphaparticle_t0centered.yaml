# @package _global_

# to execute this experiment run:
# python train.py experiment=alphaparticle_t0centered

defaults:
  - override /datamodule: default
  - override /module: t0centered
  - override /module/problem: alphaparticle
  - override /module/loss: energynormsquared
  - override /module/optimizer: adamw
  - override /module/scheduler: 1cycle
  - override /module/network@module.net_T0: piratenet
  - override /module/network@module.net_residual: piratenet 
  - override /trainer: gpu
  - override /callbacks: 
    - hparams_updater
    - val_checkpoint
    - latest_checkpoint
    - lr_monitor
    - fixed_seq_weights
    # - seq_len_scheduler
    - metrics_logger
    - tqdm_progress_bar
    - predict_and_plot_trajectory
    # - early_stopping
    - monitor_parameters


datamodule:
  train:
    # data_dir: /workspace/projects_rui/learnsolnmap/data1/alphaparticle/eps=2.7e-1/version1/Dt=1e1/train
    data_dir: /workspace/projects_rui/learnsolnmap/data1/alphaparticle/eps_mixed/version5/Dt=1e1/train
    Dt: 10.0
    # Dt_range: [-1, 1]
    sequence_len: 2
    downsample_factor: 1.0
    required_params: ['epsilon']
  test:
    # data_dir: /workspace/projects_rui/learnsolnmap/data1/alphaparticle/eps=2.7e-1/version1/Dt=1e1/test
    data_dir: /workspace/projects_rui/learnsolnmap/data1/alphaparticle/eps_mixed/version5/Dt=1e1/test
    Dt: 10.0
    # Dt_range: [-1, 1]
    sequence_len: 2
    downsample_factor: 1.0
    required_params: ['epsilon']
  batch_size: 400
  num_workers: 0

  # supervised:
  #   train:
  #     data_dir: /workspace/projects_rui/learnsolnmap/data1/3body-2d-equalmass/version6/Dt=5e-1_filtered/train
  #     Dt: 0.5
  #     # Dt_range: [-1, 1]
  #     sequence_len: 2
  #     downsample_factor: 1.0
  #   test:
  #     data_dir: /workspace/projects_rui/learnsolnmap/data1/3body-2d-equalmass/version6/Dt=5e-1_filtered/test
  #     Dt: 0.5
  #     # Dt_range: [-1, 1]
  #     sequence_len: 2
