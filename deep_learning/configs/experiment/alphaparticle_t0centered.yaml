  #   batch_size: 100

  # unsupervised:
  #   train:
  #     data_dir: /workspace/projects_rui/learnsolnmap/data1/3body-2d-equalmass/version6/inputs/train
  #     Dt: 0.0
  #     sequence_len: 1
  #     downsample_factor: 1.0
  #   test:
