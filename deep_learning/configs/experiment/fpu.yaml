# @package _global_

# to execute this experiment run:
# python train.py experiment=fpu

defaults:
  - override /module/problem: fpu
  - override /module/loss: energynormsquared
  - override /module/optimizer: adamw
  - override /module/scheduler: 1cycle
  - override /module/network: tiramisu
  - override /trainer: ddp
  - override /callbacks: 
    - model_checkpoint
    - lr_monitor
    - fixed_seq_weights
    - metrics_logger
    - tqdm_progress_bar
    - plot_energy_profile

