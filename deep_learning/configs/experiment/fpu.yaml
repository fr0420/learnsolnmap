# @package _global_

# to execute this experiment run:
# python train.py experiment=fpu

defaults:
  - override /module: solnmap
  - override /module/problem: fpu
  - override /module/loss: anchoredenergynormsquared
  - override /module/optimizer: adamw
  - override /module/scheduler: 1cycle
  # - override /module/network: mlp
  - override /module/network/i2h: identity
  - override /module/network/h2h: modmlp
  - override /module/network/h2o: identity
  - override /trainer: gpu
  - override /callbacks: 
    - val_checkpoint
    - latest_checkpoint
    - lr_monitor
    - fixed_seq_weights
    # - seq_len_scheduler
    - metrics_logger
    - tqdm_progress_bar
    - predict_and_plot_trajectory
    # - early_stopping

datamodule:
  batch_size: 100
  sequence_len: 1
  # subsample: 0.1

trainer:
  max_epochs: 500
  # min_epochs: 200
  # gradient_clip_val: 2.0
  # gradient_clip_algorithm: value
  # log_every_n_steps: 4

module:
  # Delta_t: 1.95312e-3
  Delta_t: 1.

  integrator_loss:
    # stepsize: 0.0078125   # 1/128
    stepsize: 0.001953125   # 1/512
    # stepsize: 0.00048828125   # 1/2048
    n_steps: 2
    method: VelocityVerlet
    fine_method: VelocityVerlet
    n_fine_steps_per_stepsize: 8
    include_reverse_steps: true

  regularization:
    # emb_strength: 10.
    integrator_strength: 1.
    misfit_strength: 0.

  optimizer:
    lr: 1e-3
  
  scheduler:
    scheduler:
      steps_per_epoch: 1600
      # pct_start: 0.1
      # factor: 0.8
      # patience: 8
  # phi:
  #   ckpt_path: /workspace/projects_rui/learnsolnmap/deep_learning/logs/train/runs/20240416-021944_6lxym0/checkpoints/epoch999-val_loss5.961e-06.ckpt
  
  # forward_type: stacked
  # learn_residual: false
  # scaling_factor: 1e-2

  network:
    h2h:
      input_dim: 12 
      output_dim: 12
      # n_blocks: 2
      # n_linears_per_block: 2
      # hidden_dim: 100
      # n_hidden_layers: 1
      # n_henon_layers: 16
      # activation:
      #   _target_: torch.nn.Tanh
      # n_features: 500

  problem:
    Omega: 50

callbacks:
  fixed_seq_weights:
    _target_: callbacks.sequence_weights.FixedSequenceWeights
    # weights: [0., 1., 1., 1., 0., 0.]
    weights: [0., 1.]
  # seq_len_scheduler:
    # weights: [1., 1., 1., 1., 1., 1.]
    # milestones: [10, 20, 50, 100, 200]
    # init_len: 1s

loggers:
  wandb:
    group: fpu

