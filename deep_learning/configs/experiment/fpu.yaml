# @package _global_

# to execute this experiment run:
# python train.py experiment=fpu

defaults:
  - override /module: solnmap
  - override /module/problem: fpu
  - override /module/loss: anchoredenergynormsquared
  - override /module/optimizer: adamw
  - override /module/scheduler: 1cycle
  # - override /module/network: mlp
  - override /module/network/i2h: identity
  - override /module/network/h2h: henonnet
  - override /module/network/h2o: identity
  - override /trainer: gpu
  - override /callbacks: 
    - model_checkpoint
    - lr_monitor
    - fixed_seq_weights
    # - seq_len_scheduler
    - metrics_logger
    - tqdm_progress_bar
    - plot_energy_profile

datamodule:
  batch_size: 100
  # subsample: 0.1

trainer:
  max_epochs: 1000
  # gradient_clip_val: 2.0
  # gradient_clip_algorithm: value
  # log_every_n_steps: 4

module:
  Delta_t: 1.95312e-3
  # Delta_t: 1.

  # regularization:
  #   emb_strength: 10.
  optimizer:
    lr: 1e-4
  
  # scheduler:
  #   scheduler:
  #     steps_per_epoch: 1600
    
  # phi:
  #   ckpt_path: /workspace/projects_rui/learnsolnmap/deep_learning/logs/train/runs/20240416-021944_6lxym0/checkpoints/epoch999-val_loss5.961e-06.ckpt
  
  # forward_type: stacked
  # learn_residual: false
  # scaling_factor: 1e-2

  network:
    # layer_sizes: [24, 1000, 12]

    # i2h:
    #   layer_sizes: [12, 200, 500]
    h2h:
      # input_dim: 12 
      # output_dim: 12
      # n_blocks: 2
      # n_linears_per_block: 2
      hidden_dim: 20
      n_hidden_layers: 1
      n_henon_layers: 32
      activation:
        _target_: torch.nn.Tanh
      # n_features: 500
    # h2o:
    #   layer_sizes: [500, 200, 12]

#   problem:
#     Omega: 50

callbacks:
  fixed_seq_weights:
    _target_: callbacks.sequence_weights.FixedSequenceWeights
    # weights: [0., 1., 1., 1., 1., 1.]
    weights: [0., 1.]
  # seq_len_scheduler:
    # weights: [1., 1., 1., 1., 1., 1.]
    # milestones: [10, 20, 50, 100, 200]
    # init_len: 1

loggers:
  wandb:
    group: fpu

