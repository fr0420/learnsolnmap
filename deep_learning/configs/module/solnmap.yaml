_target_: models.SolutionMap

defaults:
  - problem: fpu
  - optimizer: adamw
  - scheduler: 1cycle
  - loss: energynormsquared
  - network/i2h: identity
  - network/h2h: mlp
  - network/h2o: identity
  - _self_

Delta_t: 1.0

regularization:
  comm_strength: 0.
  lagr_strength: 0.

weight_init: xavier_uniform