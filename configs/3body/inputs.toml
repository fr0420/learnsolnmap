[problem]                           # ode problem
_name_ = "3body"
G = 1.0
m1 = 100.0
m2 = 1.0
m3 = 0.001

[algorithm]                         # data generation algorithm
_name_ = "trajensemble"
epsilon = 0.01
n_chains = 4000
n_trans_per_chain = 50

