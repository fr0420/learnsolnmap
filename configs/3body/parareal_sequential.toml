[problem]                           # ode problem
_name_ = "3body"
G = 1.0
m1 = 100.0
m2 = 1.0
m3 = 0.001

[algorithm]                         # parareal algorithm
_name_ = "sequential"

[integration]
Delta_t = 1e-2                       # time interval 
N = 1000000                              # number of intervals
Nf = 1                        # number of fine steps per interval
Nc = 1                            # number of coarse steps per interval
niters = 40                         # number of parareal iterations
fine_method = "KahanLi8"            # fine solver method
coarse_method = "VelocityVerlet"        # coarse solver method
# nn_ckpt_path =                    # nn checkpoint path
use_float64x4 = true               # use Float64x4 for coarse solver (fine solver always uses Float64x4)
