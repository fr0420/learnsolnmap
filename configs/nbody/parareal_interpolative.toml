[problem]                           # ode problem
_name_ = "nbody"

[algorithm]                         # parareal algorithm
_name_ = "interpolative"  
tol = 1e-14
use_bias = true
centering = true
k_most_recent = -1
k_nearest = -1

[integration]
Delta_t = 500.0                       # time interval 
N = 200                              # number of intervals
Nf = 40                         # number of fine steps per interval
Nc = 4                             # number of coarse steps per interval
niters = 40                         # number of parareal iterations
fine_method = "KahanLi8"            # fine solver method
coarse_method = "VelocityVerlet"        # coarse solver method
# nn_ckpt_path =                    # nn checkpoint path
use_float64x4 = false               # use Float64x4 for coarse solver (fine solver always uses Float64x4)
