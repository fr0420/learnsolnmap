[problem]                           # ode problem
_name_ = "nco"
epsilon = 0.01

[algorithm]                         # parareal algorithm
_name_ = "procrustes"
batch = true
with_additive = true
use_scaling = false
window_size = -1 
k_most_recent = 1

[integration]
Delta_t = 20.0                       # time interval 
N = 250                              # number of intervals
Nf = 2000                         # number of fine steps per interval
Nc = 4                            # number of coarse steps per interval
niters = 10                         # number of parareal iterations
fine_method = "KahanLi8"            # fine solver method
coarse_method = "VelocityVerlet"        # coarse solver method
use_float64x4 = false               # use Float64x4 for coarse solver (fine solver always uses Float64x4)
nn_ckpt_path = "/workspace/projects_rui/learnsolnmap/deep_learning/logs/train/runs/20250325-111045_2zcxko/checkpoints/latest-epoch02085.ckpt"                   # nn checkpoint path
nn_model_name = "TaylorBasedIdentityEnforcedSolutionMap"
