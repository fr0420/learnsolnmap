[problem]                           # ode problem
_name_ = "1body"
ecc = 0.5                           # eccentricity

[integration]
dt = 2e-2                       # time interval 
nsteps = 1                        # number of steps per interval
N = 50000                              # number of intervals
method = "KahanLi8"            # solver method
adaptive = false                # adaptive time stepping
use_float64x4 = true               # use Float64x4
retfull = false             # return full history
